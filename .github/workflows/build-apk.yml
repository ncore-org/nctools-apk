name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # ubuntu-latest runners ship a full Android SDK; setup-android@v3
        # recently breaks on `sdkmanager tools` (package removed upstream),
        # so we locate the preinstalled SDK instead of re-installing it.
        run: |
          SDK_DIR=/usr/local/lib/android/sdk
          if [ ! -d "$SDK_DIR" ]; then SDK_DIR=$ANDROID_SDK_ROOT; fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nctools-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true